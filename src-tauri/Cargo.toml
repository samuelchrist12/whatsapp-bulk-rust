[package]
name = "app"
version = "1.0.0"
description = "Bulk WA Sender - High performance desktop bulk WhatsApp sender"
authors = ["schrist."]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
calamine = "0.38"
walkdir = "2.5"
regex = "1.10"
rfd = "0.15"
