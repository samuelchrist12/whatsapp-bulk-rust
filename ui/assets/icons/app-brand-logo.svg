<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="brandGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Glowing Accent -->
    <linearGradient id="sparkGrad" x1="30" y1="30" x2="98" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#047857" flood-opacity="0.35" />
    </filter>

    <!-- Glow Filter for Transmitters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Shield Container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#brandGrad)" filter="url(#shadowFilter)" />

  <!-- Outer Pulse Antenna Wave -->
  <path d="M 82 32 A 40 40 0 0 1 100 68" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <path d="M 74 38 A 30 30 0 0 1 88 64" stroke="#D1FAE5" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />

  <!-- Inner Chat Bubble Frame -->
  <path d="M 32 38 C 32 29.163 39.163 22 48 22 L 72 22 C 80.837 22 88 29.163 88 38 L 88 64 C 88 72.837 80.837 80 72 80 L 46 80 L 30 94 L 33 78 C 32.35 77.2 32 75.8 32 74 Z" 
        fill="#FFFFFF" fill-opacity="0.14" stroke="url(#sparkGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Speed Lightning Broadcast Bolt -->
  <path d="M 64 36 L 46 60 L 58 60 L 52 82 L 74 54 L 62 54 Z" 
        fill="url(#sparkGrad)" filter="url(#glow)" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Tactical Orbit Nodes -->
  <circle cx="94" cy="94" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="28" cy="28" r="3.5" fill="#6EE7B7" opacity="0.8" />
  <circle cx="100" cy="68" r="2.5" fill="#A7F3D0" />
</svg>
