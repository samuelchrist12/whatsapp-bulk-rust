<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 36" width="130" height="36" fill="none">
  <defs>
    <linearGradient id="sealGrad" x1="0" y1="0" x2="130" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
  </defs>
  <!-- Background Pill -->
  <rect x="1" y="1" width="128" height="34" rx="17" fill="#0F172A" stroke="url(#sealGrad)" stroke-width="1.5" />
  
  <!-- Studio Diamond Symbol -->
  <g transform="translate(12, 11)">
    <polygon points="7,0 14,7 7,14 0,7" fill="#10B981" />
    <polygon points="7,2 12,7 7,12 2,7" fill="#0F172A" />
    <circle cx="7" cy="7" r="2.2" fill="#6EE7B7" />
  </g>
  
  <!-- Text Label -->
  <text x="33" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#E2E8F0">
    by <tspan fill="#6EE7B7">schrist.</tspan>
  </text>
  
  <!-- Verified Dot -->
  <circle cx="114" cy="18" r="3" fill="#10B981" />
  <circle cx="114" cy="18" r="5" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
</svg>
